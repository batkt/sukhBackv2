# MediaMTX — зогсоолын камеруудын нэгдсэн медиа сервер.
#
# Урсгалын чиглэл:
#   барилгын PC (ffmpeg) --RTSP:8554--> ЭНЭ сервер --WHEP--> хөтөч / апп
#
# Зам (path) нэр: {barilgiinId}/{камерын-ip-зураастай}
#   жишээ: 6a978709d2d69c94c9e97f29/192-168-1-110
# Энэ дүрмийг Rust worker-ийн `Config::stream_path` бас хөтөч хоёулаа
# ижилхэн боддог тул хаягийг тохируулах шаардлагагүй.

logLevel: info
logDestinations: [stdout]

# Удирдлагын API — ямар урсгал ирж байгааг шалгахад хэрэгтэй.
# Анхдагчаараа УНТРААЛТТАЙ байдаг тул ил асаана. Зөвхөн дотоод хаяг дээр
# сонсоно: nginx-ээр гаргахгүй, гаднаас хандах шаардлагагүй.
api: yes
apiAddress: 127.0.0.1:9997

# Нэг ч үзэгчгүй үед ч publisher-ийг таслахгүй — урсгал үргэлж бэлэн
# байснаар цонх нээмэгц агшин зуур эхэлнэ.
readTimeout: 30s
writeTimeout: 30s
# Бичих дараалал нь САЙТАД саатал болж хуримтлагддаг: уншигч хоцровол
# MediaMTX пакетуудыг эндээ хурааж, дараа нь бөөнөөр өгдөг. Шууд дамжуулалтад
# бага байх нь зөв — хоцорсон фрэйм хуучирсны дараа хэрэггүй болно.
writeQueueSize: 128

###############################################################################
# Эрх
###############################################################################
# Нийтлэх нь ЗААВАЛ нууц үгтэй — эс бөгөөс хэн ч дурын зам руу өөрийн
# урсгалыг түлхэж, камерын зургийг сольж чадна.
# Үзэх нь нээлттэй: хуудас өөрөө нэвтрэлтийн ард байдаг ба замын нэр нь
# таахад бэрх (barilgiinId + дотоод IP).
authInternalUsers:
  - user: publisher
    pass: SOLIH_NUUTS_UG           # ← заавал солино, config.toml-д ч ижил
    ips: []
    permissions:
      - action: publish
  - user: any
    permissions:
      - action: read
      # Удирдлагын API нь ЭНЭ жагсаалтын харьяанд ордог — эрх өгөхгүй бол
      # `/v3/paths/list` нь "authentication error" буцаана. `apiAddress` нь
      # зөвхөн 127.0.0.1 дээр сонсдог тул гаднаас хандах боломжгүй.
      - action: api

###############################################################################
# RTSP — зөвхөн БАРИЛГААС нийтлэхэд
###############################################################################
rtsp: yes
rtspAddress: :8554
# UDP дээр пакет алдагдвал зураг задардаг; барилга ↔ VPS хооронд TCP найдвартай.
rtspTransports: [tcp]

###############################################################################
# WebRTC / WHEP — үзэгчид энэ рүү холбогдоно
###############################################################################
webrtc: yes
webrtcAddress: :8889

# ── TLS-ийг MediaMTX ӨӨРӨӨ барина, nginx-ээр дамжуулахгүй ───────────────
# WHEP нь хоёр шаттай: `POST` (offer → answer), дараа нь хөтөч өөрийн ICE
# candidate-уудаа сервер буцаасан `Location` хаяг руу `PATCH`-аар илгээнэ.
# nginx дээр `/whep/` угтвартай прокси хийвэл тэр хаяг эвдэрч, сервер
# хөтчийн candidate-ыг ХЭЗЭЭ Ч авахгүй — дохио зүгээр солилцогдсон мөртлөө
# медиа явахгүй, логд `deadline exceeded while waiting connection`,
# API-д `outboundBytes: 0` гэж харагдана.
#
# Домэйн ижил тул nginx-ийн сертификат яг таарна: хаяг нь
# https://amarhome.mn:8889/<зам>/whep болно.
webrtcEncryption: yes
webrtcServerCert: /etc/nginx/fullchain.crt
webrtcServerKey: /etc/nginx/amarhome.key
# TLS-ийг nginx хийнэ (доорх README-г үз) — MediaMTX дотооддоо цэвэр HTTP,
# шифрлэлт анхдагчаараа унтраалттай тул тусад нь заах шаардлагагүй.
webrtcAllowOrigin: '*'
webrtcTrustedProxies: [127.0.0.1]

# ── ХАМГИЙН ЧУХАЛ ХОЁР МӨР ───────────────────────────────────────────────
# Медиа нь nginx-ээр ДАМЖДАГГҮЙ, шууд энэ порт руу ирнэ. Нийтийн IP-г ил
# зааж өгөхгүй бол сервер зөвхөн дотоод хаягаа санал болгож, ICE унана —
# яг л хуучин P2P зурагтай адил "Холбогдож байна" давтагдана.
webrtcLocalUDPAddress: :8189

# ICE-ийг TCP дээр ч санал болгоно.
#
# Зарим сүлжээ (үүлэн үйлчилгээний DDoS шүүлтүүр, байгууллагын галт хана,
# гар утасны зарим оператор) UDP-г бүхэлд нь таслачихдаг. Тэр үед зөвхөн
# UDP candidate байвал дохио амжилттай солилцоод медиа огт явахгүй —
# MediaMTX-ийн логд `deadline exceeded while waiting connection`, API-д
# `outboundBytes: 0` гэж харагдана.
#
# TCP нь UDP-ээс өчүүхэн удаан ч найдвартай. Хоёуланг нь санал болговол
# хөтөч боломжтойг нь өөрөө сонгоно.
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: [103.236.194.99]
# Гал хамгаалалтад 8189/udp-г БҮХ чиглэлээс нээх шаардлагатай.

###############################################################################
# LL-HLS — нөөц зам (WebRTC хаагдсан сүлжээ, эсвэл хуучин төхөөрөмж)
###############################################################################
# HLS-ийг УНТРААВ.
#
# `hlsAlwaysRemux: yes` нь үзэгч байхгүй ч урсгал БҮРИЙГ тасралтгүй remux
# хийдэг — 10+ урсгал дээр CPU шавхаж, WebRTC-ийн пакет тарааход нөлөөлж,
# саатал хуримтлуулна. Вэб ч, апп ч WHEP ашигладаг тул HLS хэрэггүй.
#
# Хэрэв хэзээ нэгэн цагт HLS нөөц зам болгон хэрэгтэй бол `hls: yes` болгоод
# `hlsAlwaysRemux`-ыг УНТРААЛТТАЙ (`no`) үлдээ — тэгвэл зөвхөн үзэгч байх үед
# remux хийнэ.
hls: no

rtmp: no
srt: no

###############################################################################
# Зам
###############################################################################
# Бүх замыг урьдчилан бичихгүй: барилга нэмэгдэхэд серверт гар хүрэхгүйгээр
# publisher өөрөө шинэ зам үүсгэнэ.
paths:
  all_others:
    # ── Урсгалыг ҮЗЭГЧЭЭР удирдана ────────────────────────────────────
    # Нийтлэгчгүй зам дээр уншигч ирэхэд скрипт ажиллаж, барилгын worker-т
    # "энэ урсгалыг аса" гэж мэдэгдэнэ. Сүүлийн уншигч гарсны дараа
    # `runOnDemandCloseAfter` хугацаанд хүлээгээд скриптийг таслана —
    # скрипт нь `stop` илгээж ffmpeg-ийг зогсооно.
    #
    # Байнга ажиллах урсгалууд (хаалганы камер) нь нийтлэгчтэй байдаг тул
    # эдгээр дэгээ тэдэн дээр ОГТ ажиллахгүй.
    runOnDemand: /opt/mediamtx-urgats.sh $MTX_PATH
    runOnDemandRestart: no
    # ffmpeg асахад ~1-3 секунд. Хөтчийн WHEP хүсэлт энэ хугацаанд хүлээнэ,
    # нийтлэгч гарч ирмэгц 201 авна — 404 болж унахгүй.
    runOnDemandStartTimeout: 20s
    # Камер хооронд сэлгэхэд шууд таслахгүй байх зай.
    runOnDemandCloseAfter: 20s
