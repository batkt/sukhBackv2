# coturn config for amarhome.mn (103.236.194.99)
#
# Purpose: relay WebRTC media between the browser and the on-site R2W server
# when a direct path can't be established. Both peers reach this server with
# *outbound* connections, which always survive NAT — that is what makes the
# camera stream reliable instead of "works when IPv6 happens to cooperate".
#
# Install:  sudo apt install coturn
# Enable:   sudo sed -i 's/^#TURNSERVER_ENABLED/TURNSERVER_ENABLED/' /etc/default/coturn
# Place at: /etc/turnserver.conf
# Start:    sudo systemctl enable --now coturn

listening-port=3478
tls-listening-port=5349

# Listen on all interfaces; advertise the public address in relayed candidates.
# external-ip is REQUIRED on a NAT'd/cloud host or peers receive an unroutable
# relay address and the whole thing silently fails.
listening-ip=0.0.0.0
external-ip=103.236.194.99

realm=amarhome.mn
server-name=amarhome.mn

# Long-term credential mechanism (username/password).
lt-cred-mech

# Relay port range — must match what you open in the firewall.
min-port=49160
max-port=49200

# --- Abuse limits -----------------------------------------------------------
# TURN credentials shipped to a browser are inherently visible to anyone who
# can load the page, so cap what a leaked credential can cost you.
# user-quota  = concurrent allocations per user
# total-quota = concurrent allocations server-wide
user-quota=12
total-quota=1200
# Bytes-per-second per allocation (0 = unlimited). ~1.5 Mbps is plenty for
# a single sub-stream camera feed and stops bulk relaying.
max-bps=200000

# Refuse to relay to loopback/private/multicast ranges so this can't be used
# to reach anything inside the VPS or probe internal networks.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No telnet CLI, no unnecessary surface.
no-cli
no-tlsv1
no-tlsv1_1

# --- TLS (optional but recommended) -----------------------------------------
# turns:// on 5349 gets through networks that block plain UDP/TCP TURN.
# Reuse the existing Let's Encrypt cert for amarhome.mn. coturn runs as the
# `turnserver` user, so it needs read access to these files.
#cert=/etc/letsencrypt/live/amarhome.mn/fullchain.pem
#pkey=/etc/letsencrypt/live/amarhome.mn/privkey.pem

# Log to syslog rather than an unbounded file.
syslog

# --- Credentials ------------------------------------------------------------
# Do NOT commit a real password. Generate one and append it on the server:
#   PW=$(openssl rand -base64 24)
#   echo "user=zevturn:$PW" | sudo tee -a /etc/turnserver.conf
#   echo "$PW"   # put this in NEXT_PUBLIC_TURN_PASS and R2W's config.json
